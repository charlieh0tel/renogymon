name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-ci:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      build-deps: "libdbus-1-dev"
      # so clippy sees every target
      check-args: "--workspace --all-targets"
      # fmt-toolchain is left at its default of nightly on purpose: this repo
      # has a rustfmt.toml setting imports_granularity, which is a nightly-only
      # option. Stable rustfmt ignores it with a warning, so the check would
      # pass on imports the setting is supposed to govern.
