name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-collector:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    with:
      package: renogymon-collector
      build-deps: "libdbus-1-dev"
      artifact-suffix: collector
    secrets: inherit

  build-deb-aprs:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    with:
      package: renogymon-aprs
      build-deps: "libdbus-1-dev"
      artifact-suffix: aprs
    secrets: inherit

  build-deb-archiver:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    with:
      package: renogymon-archiver
      artifact-suffix: archiver
    secrets: inherit

  build-deb-puller:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    with:
      package: renogymon-archiver-puller
      artifact-suffix: puller
    secrets: inherit

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev rsync
      - name: Run workspace unit + integration tests
        run: cargo test --workspace
      - name: Run gated system tests
        run: |
          cargo test -p renogymon-archiver --test system -- --ignored
          cargo test -p renogymon-archiver-puller --test pull -- --ignored

  trigger-apt-repo:
    needs: [build-deb-collector, build-deb-aprs, build-deb-archiver, build-deb-puller, tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger APT repo rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.APT_REPO_TOKEN }}
          repository: charlieh0tel/apt-repo
          event-type: update-apt-repo