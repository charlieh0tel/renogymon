name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb-collector:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job.  At workflow level it would also be granted to
    # the dispatch job below, which authenticates with its own PAT and
    # writes nothing here.
    permissions:
      contents: write
    with:
      # The `tests` job below already runs the whole workspace, including the
      # gated system tests, so the four deb builds do not each run it again.
      run-tests: false
      package: renogymon-collector
      build-deps: "libdbus-1-dev"
      artifact-suffix: collector

  build-deb-aprs:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      run-tests: false
      package: renogymon-aprs
      build-deps: "libdbus-1-dev"
      artifact-suffix: aprs

  build-deb-archiver:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      run-tests: false
      package: renogymon-archiver
      artifact-suffix: archiver

  build-deb-puller:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      run-tests: false
      package: renogymon-archiver-puller
      artifact-suffix: puller

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # dtolnay/rust-toolchain does not read rust-toolchain.toml, so take the
      # channel from it, as the deb-workflows reusable workflows do.
      - name: Resolve Rust toolchain
        id: rust-toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)
          echo "Rust toolchain: ${TOOLCHAIN}"
          echo "toolchain=${TOOLCHAIN}" >> "${GITHUB_OUTPUT}"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev rsync
      - name: Run workspace unit + integration tests
        run: cargo test --workspace
      - name: Run gated system tests
        run: |
          cargo test -p renogymon-archiver --test system -- --ignored
          cargo test -p renogymon-archiver-puller --test pull -- --ignored

  trigger-apt-repo:
    needs: [build-deb-collector, build-deb-aprs, build-deb-archiver, build-deb-puller, tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      # workflow_dispatch, not repository_dispatch: the token then needs
      # Actions: write on apt-repo instead of Contents: write, which could
      # push a commit to the workflow that runs with the GPG signing key.
      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: gh workflow run update-repo.yml -R charlieh0tel/apt-repo
