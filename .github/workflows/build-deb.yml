name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb-collector:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job.  At workflow level it would also be granted to
    # the dispatch job below, which authenticates with its own PAT and
    # writes nothing here.
    permissions:
      contents: write
    with:
      # The `tests` job below already runs the whole workspace, including the
      # gated system tests, so the four deb builds do not each run it again.
      run-tests: false
      package: renogymon-collector
      build-deps: "libdbus-1-dev"
      artifact-suffix: collector

  build-deb-aprs:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      run-tests: false
      package: renogymon-aprs
      build-deps: "libdbus-1-dev"
      artifact-suffix: aprs

  build-deb-archiver:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      run-tests: false
      package: renogymon-archiver
      artifact-suffix: archiver

  build-deb-puller:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      run-tests: false
      package: renogymon-archiver-puller
      artifact-suffix: puller

  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust toolchain
        # A pinned rust-toolchain action cannot take the channel from the ref,
        # so the channel is named here.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev rsync
      - name: Run workspace unit + integration tests
        run: cargo test --workspace
      - name: Run gated system tests
        run: |
          cargo test -p renogymon-archiver --test system -- --ignored
          cargo test -p renogymon-archiver-puller --test pull -- --ignored

  trigger-apt-repo:
    needs: [build-deb-collector, build-deb-aprs, build-deb-archiver, build-deb-puller, tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger APT repo rebuild
        # Pinned: this step is handed a token that can write to
        # charlieh0tel/apt-repo, and a tag can be moved to point at anything.
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.APT_REPO_TOKEN }}
          repository: charlieh0tel/apt-repo
          event-type: update-apt-repo
